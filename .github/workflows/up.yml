name: Hugo Build and Deploy

# 触发条件：推送到主分支（如 main 或 master）时执行
on:
  push:
    branches: [ "main" ]  # 根据你的主分支名称修改
permissions:
  contents: write  # 允许读写仓库内容（用于推送 gh-pages 分支）
jobs:
  deploy:
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境
    steps:
      # 步骤1：拉取代码仓库
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # 拉取子模块（如果主题是通过 submodule 管理的）
          fetch-depth: 0   # 确保获取完整历史，避免 Hugo 构建警告

      # 步骤2：安装 Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'  # 使用最新版 Hugo
          # 如果需要特定版本，替换为具体版本号，如 '0.124.1'

      # 步骤3：构建 Hugo 站点
      - name: Build
        run: hugo --minify  # --minify 压缩输出文件

      # 步骤4：部署到 gh-pages 分支

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
            branch: gh-pages
            folder: public
        #    token: ${{ secrets.ACCESSTOKEN }}
            # clean: true
            single-commit: true
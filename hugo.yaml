            date: "Dec 2023 - present"
            content: "Focused on remote sensing-based monitoring of glacier and glacial lake evolution under extreme conditions (high elevation, frequent cloud cover) and advanced the geometric distortion correction of SAR imagery, achieving high-precision image rectification"
            
      - company: "ApplDepartment of Earth and Environmental Sciences, The Chinese University of Hong Konge"
        companyUrl: "https://www.ees.cuhk.edu.hk"
        jobs: 
        - name: "Research Assistant"
          date: "Jul 2025-Sept 2025"
          content: "Analysis of Influencing Factors of Thermal Melting Collapses in Different Basins of the Qinghai-Tibet Plateau Based on Multi-Source Remote Sensing and Geospatial Analysis"

      - company: "Shanghai Jiaotong University John Hopcroft Center"
        companyUrl: "https://jhc.sjtu.edu.cn"
        jobs:
        - name: "Image Generation Inter"
          date: "Sept 2025-Present"
          content: "Led the improvement of core modules in image generation algorithms. Addressed the sampling efficiency issue of the Stable Diffusion model by optimizing scheduler logic and attention mechanisms."

      - company: "Shanxi Coking Coal Group Co., Ltd."

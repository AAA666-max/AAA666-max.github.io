          content: "Processed UAV-acquired images for 3D modeling and texture mapping of roads and buildings in Jiaxing, Zhejiang Province."
      
      - company: "Sichuan Changhong Hongwei Technology Co., Ltd"
        companyUrl: "https://homwee.net"
        jobs:
        - name: "Algorithm enginner intern"
          date: "Oct 2025-Present"
          content: "Responsible for the improvement of robot navigation algorithms"
    
